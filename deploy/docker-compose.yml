# synctool-relay — 裸 IP / NAT VPS 一键直连部署（内置 730 天自签 TLS 1.3 + SPKI Pinning）
#
# 首次初始化（生成随机私有 AccessKey、730 天自签证书并打印客户端扫码配置 URI）：
#   SYNCTOOL_PUBLIC_HOST=你的VPS公网IP docker compose run --rm synctool-relay init
# 启动服务：
#   docker compose up -d

services:
  synctool-relay:
    image: ghcr.io/yellowdking/synctool:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: synctool-relay
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 192m
    ports:
      - "54843:54843"
    environment:
      # 填入你的 VPS 公网 IP（用于生成证书 IP SAN 与客户端导入 URI）
      SYNCTOOL_PUBLIC_HOST: "${SYNCTOOL_PUBLIC_HOST:-}"
      # 自动按容器/VPS 内存选档：auto | nano | standard | media
      SYNCTOOL_PROFILE: "${SYNCTOOL_PROFILE:-auto}"
      # 离线暂存总开关：auto（按档位自动）| off（手动彻底关闭离线暂存，仅保留实时零落盘管道）| memory | disk
      SYNCTOOL_SPOOL: "${SYNCTOOL_SPOOL:-auto}"
      SYNCTOOL_TLS: "selfsigned"
      SYNCTOOL_DATA_DIR: "/data"
      # 可选：按需限制全局带宽（Mbps）保护按流量计费的 NAT 小鸡，0 表示不限
      SYNCTOOL_MAX_BANDWIDTH_MBPS: "${SYNCTOOL_MAX_BANDWIDTH_MBPS:-0}"
    volumes:
      - synctool_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  synctool_data:

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-test:
    name: Go Vet, Zero-Dep Check & Race Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Verify zero third-party Go dependencies
        run: |
          if grep -E '^\s*require\b' go.mod; then
            echo "ERROR: go.mod must have zero third-party dependencies"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go test (with race detector)
        run: go test -race -count=1 ./...

      - name: Cross-compile static binaries (linux amd64/arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/synctool-relay-amd64 ./cmd/synctool-relay
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/synctool-relay-arm64 ./cmd/synctool-relay
          if [ -d ./cmd/synctool ]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/synctool-amd64 ./cmd/synctool
          fi

  ts-test:
    name: TypeScript / WebCrypto SDK Golden Vectors & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify zero runtime dependencies in sdk/ts/package.json
        run: |
          node -e '
            const pkg = JSON.parse(require("fs").readFileSync("sdk/ts/package.json", "utf8"));
            const deps = Object.keys(pkg.dependencies || {});
            if (deps.length > 0) {
              console.error("ERROR: sdk/ts must have zero runtime dependencies, found:", deps);
              process.exit(1);
            }
          '

      - name: Run WebCrypto SDK tests & golden vectors
        working-directory: sdk/ts
        run: node --test test/*.test.mjs

  kotlin-test:
    name: Kotlin / JVM SDK Golden Vectors & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify zero binary .jar files in repository
        run: |
          if git ls-files | grep -Ei '\.jar$'; then
            echo "ERROR: binary .jar files (such as gradle-wrapper.jar) must not be committed"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Kotlin SDK unit tests & golden vectors
        run: gradle -p sdk/kotlin test --info

  swift-test:
    name: Swift SDK Golden Vectors, Live Relay E2E & iOS Simulator Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Verify zero external Swift dependencies
        run: |
          for mf in Package.swift sdk/swift/Package.swift; do
            if [ ! -f "$mf" ]; then
              echo "ERROR: missing $mf"
              exit 1
            fi
            if sed 's|//.*||' "$mf" | grep -E '\.package\s*\('; then
              echo "ERROR: $mf must have zero external dependencies"
              exit 1
            fi
          done

      - name: Build Go binaries & run Swift SDK tests (01..07 vectors + live Relay/CLI E2E)
        shell: bash
        run: |
          emit_diag() {
            python3 - "$1" "$2" <<'PY'
          import pathlib, sys
          label, p = sys.argv[1], pathlib.Path(sys.argv[2])
          if p.is_file():
              lines = [l.strip() for l in p.read_text(errors="replace").splitlines() if l.strip()]
              errs = [l for l in lines if any(k in l for k in ("error:", "Error:", "FAIL", "fatal", "XCTAssert", "failed"))]
              chosen = (errs[-40:] + lines[-20:]) if errs else lines[-45:]
              for i in range(0, len(chosen), 7):
                  print(f"::error title={label}_{i}::{' || '.join(chosen[i:i+7])[:3500]}")
          PY
          }
          set -o pipefail
          if ! swift build 2>&1 | tee /tmp/swift-root.log; then
            emit_diag "SWIFT_ROOT_BUILD" /tmp/swift-root.log
            exit 1
          fi
          go build -o /tmp/synctool-relay-e2e ./cmd/synctool-relay
          go build -o /tmp/synctool-cli-e2e ./cmd/synctool
          if ! SYNCTOOL_RELAY_BIN=/tmp/synctool-relay-e2e SYNCTOOL_CLI_BIN=/tmp/synctool-cli-e2e swift test --package-path sdk/swift 2>&1 | tee /tmp/swift-test.log; then
            emit_diag "SWIFT_TEST" /tmp/swift-test.log
            exit 1
          fi

      - name: Build SyncToolSDK for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          if ! (cd sdk/swift && xcodebuild build -scheme SyncToolSDK -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO) 2>&1 | tee /tmp/swift-ios-sim.log; then
            python3 -c 'import pathlib; lines=[l.strip() for l in pathlib.Path("/tmp/swift-ios-sim.log").read_text(errors="replace").splitlines() if "error:" in l or "failed" in l.lower()][-35:]; [print(f"::error title=IOS_SIM_{i}::" + " || ".join(lines[i:i+7])[:3500]) for i in range(0,len(lines),7)]'
            exit 1
          fi

  cross-lang-e2e:
    name: Cross-Language E2E (Go <-> Relay <-> TS <-> Kotlin)
    needs: [go-test, ts-test, kotlin-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Go E2E suite
        run: |
          if [ -d ./e2e ]; then
            go test -race -v ./e2e/...
          fi

      - name: Run Cross-Language Go <-> TS E2E script
        run: |
          if [ -f ./e2e/cross_lang.mjs ]; then
            node ./e2e/cross_lang.mjs
          fi

      - name: Build synctool-relay binary & run Kotlin <-> Go Relay E2E suite
        run: |
          go build -o /tmp/synctool-relay-e2e ./cmd/synctool-relay
          SYNCTOOL_RELAY_BIN=/tmp/synctool-relay-e2e gradle -p sdk/kotlin test --tests "*CrossLangRelayE2ETest*" --rerun-tasks --info

  docker-build:
    name: Docker Scratch Image Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build multi-stage scratch image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: synctool-relay:ci-test

      - name: Smoke test container init subcommand
        run: |
          docker run --rm --read-only --tmpfs /data:uid=65532,gid=65532 synctool-relay:ci-test init --public-host 127.0.0.1 >/dev/null
